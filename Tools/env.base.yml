name: overpass
channels:
  - conda-forge
dependencies:
  - python=3.11
  - jupyterlab
  - ipywidgets
  - ipyleaflet
  - geopandas
  - shapely>=2.0
  - pyproj
  - folium
  - skyfield
  - timezonefinder
  - tzdata            # IANA zone database (required on Windows for zoneinfo)
  - pandas
  - numpy
  - matplotlib
  - requests
  - pyyaml

# Export only the core packages you requested
#conda env export --from-history > env.base.yml
# Pin a production lockfile after a successful build
#conda env export -n overpass > Tools/env.lock.yml
